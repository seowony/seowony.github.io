<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Places | Seo-Won Chang</title>
<meta name="description" content="Photos from the observatories and institutes where Seo-Won Chang has worked.">
<meta property="og:title" content="Places | Seo-Won Chang">
<meta property="og:description" content="Photos from the places I have worked.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://seowony.github.io/places.html">
<meta property="og:image" content="https://seowony.github.io/assets/place-stromlo-2017.jpg">
<link rel="canonical" href="https://seowony.github.io/places.html">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,300;0,6..72,400;0,6..72,500;1,6..72,400&family=Karla:wght@400;500;600&display=swap">
<style>
  :root {
    --paper:  #E5E9E4;
    --panel:  #F3F6F1;
    --ink:    #18211E;
    --body:   #3C463F;
    --second: #4E584F;
    --label:  #7C867C;
    --rule:   #C3CCC1;
    --edge:   #CBD3C9;
    --accent: #B02E26;
    --accent-d: #7E1F1A;

    --serif: Newsreader, "Iowan Old Style", Georgia, serif;
    --sans:  Karla, "Helvetica Neue", Arial, sans-serif;
    --gutter: clamp(16px, 5vw, 56px);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: var(--sans);
    font-size: 16px;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }

  a { color: var(--accent); text-decoration: none; }
  a:hover { color: var(--accent-d); text-decoration: underline; }
  a:focus-visible, .skip:focus { outline: 2px solid var(--accent); outline-offset: 3px; }

  .wrap { max-width: 1120px; margin-inline: auto; padding-inline: var(--gutter); }

  .skip { position: absolute; left: -9999px; background: var(--ink); color: var(--paper); padding: 10px 16px; z-index: 10; }
  .skip:focus { left: 8px; top: 8px; }

  header.site { position: sticky; top: 0; background: var(--paper); border-bottom: 1px solid var(--edge); z-index: 5; }
  .bar { display: flex; align-items: center; justify-content: space-between; gap: 14px; flex-wrap: wrap; padding-block: 14px; }
  .wordmark { display: flex; align-items: center; gap: 10px; font-family: var(--serif); font-size: 19px; }
  nav.site ul { list-style: none; display: flex; flex-wrap: wrap; gap: 6px 20px; margin: 0; padding: 0; font-size: 14.5px; }
  nav.site a { color: var(--second); }
  nav.site a:hover { color: var(--ink); }

  h1, h2, h3 { font-family: var(--serif); font-weight: 400; margin: 0; text-wrap: balance; }
  h1 { font-size: clamp(34px, 5.4vw, 50px); line-height: 1.06; letter-spacing: -0.01em; }
  h2 { font-size: clamp(25px, 3.4vw, 32px); line-height: 1.15; }
  h3 { font-size: clamp(19px, 2.4vw, 23px); line-height: 1.28; }
  p { margin: 0; }

  .kicker { font-size: 12px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--label); margin: 0; }
  .affil { font-family: var(--serif); font-size: clamp(17px, 2.2vw, 19px); color: var(--ink); line-height: 1.4; margin: 0; }
  .affil a { color: var(--ink); border-bottom: 1px solid var(--rule); }
  .affil a:hover { color: var(--accent); border-color: var(--accent); text-decoration: none; }
  section { padding-block: clamp(40px, 6vw, 60px); }
  .sechead { display: flex; align-items: baseline; justify-content: space-between; gap: 14px; flex-wrap: wrap;
             border-bottom: 1px solid var(--rule); padding-bottom: 13px; margin-bottom: 30px; }

  /* hero */
  .hero { display: grid; gap: clamp(24px, 4vw, 44px); align-items: start; }
  @media (min-width: 760px) { .hero { grid-template-columns: 240px minmax(0, 1fr); } }
  .portrait { width: 100%; max-width: 240px; height: auto; display: block; border: 1px solid var(--edge); background: var(--panel); }
  .hero-copy { display: flex; flex-direction: column; gap: 18px; }
  .hero-copy p.bio { color: var(--body); line-height: 1.72; max-width: 64ch; font-size: 16.5px; }
  .idlinks { display: flex; flex-wrap: wrap; gap: 8px 10px; }
  .idlinks a {
    font-size: 14px; padding: 9px 15px; border: 1px solid var(--edge);
    color: var(--second); background: var(--panel); text-decoration: none;
  }
  .idlinks a:hover { border-color: var(--ink); color: var(--ink); text-decoration: none; }
  .idlinks a.strong { background: var(--ink); color: var(--paper); border-color: var(--ink); }
  .idlinks a.strong:hover { background: var(--accent); border-color: var(--accent); color: #fff; }

  /* illustrations */
  svg.art { display: block; width: 100%; height: auto; }
  .ln  { fill: none; stroke: var(--ink); stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
  .lnt { fill: none; stroke: var(--ink); stroke-width: 1.1; stroke-linecap: round; stroke-linejoin: round; }
  .dash{ fill: none; stroke: var(--label); stroke-width: 1.1; stroke-dasharray: 3 5; stroke-linecap: round; }
  .ac  { fill: none; stroke: var(--accent); stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
  .acf { fill: var(--accent); }
  .lnf { fill: var(--ink); }
  text.cap { font-family: var(--sans); font-size: 12px; letter-spacing: 1.4px; fill: var(--label); }

  /* research cards */
  .topics { display: grid; gap: clamp(28px, 4vw, 40px); }
  @media (min-width: 880px) { .topics { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  .topic { display: flex; flex-direction: column; gap: 14px; }
  .plate { background: var(--panel); border: 1px solid var(--edge); padding: 16px; }
  .topic p { font-size: 15.5px; line-height: 1.68; color: var(--body); }

  /* programs */
  .progs { display: flex; flex-direction: column; }
  .prog { display: grid; gap: 6px 20px; padding-block: 22px; border-top: 1px solid var(--edge); }
  .prog:first-child { border-top: 0; padding-top: 0; }
  @media (min-width: 720px) { .prog { grid-template-columns: 52px minmax(0, 1fr) 200px; } }
  .prog-mark svg { display: block; width: 34px; height: 34px; }
  .prog p { color: var(--body); line-height: 1.66; font-size: 15px; max-width: 62ch; }
  .prog .meta { font-size: 13px; line-height: 1.6; color: var(--label); }
  .prog .meta b { font-weight: 500; color: var(--second); display: block; margin-bottom: 3px; }
  .queue { margin-top: 26px; border-top: 1px solid var(--rule); padding-top: 20px; display: grid; gap: 10px 32px; }
  @media (min-width: 720px) { .queue { grid-template-columns: 52px minmax(0, 1fr); } }
  .queue ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 7px; }
  .queue li { font-size: 15px; color: var(--second); }
  .queue li::before { content: "— "; color: var(--label); }

  /* gallery */
  .gallery { display: grid; gap: 18px; }
  @media (min-width: 720px) { .gallery { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  .gallery-item { display: flex; flex-direction: column; }
  .gallery-item.wide { grid-column: 1 / -1; }
  .gallery-item img { width: 100%; height: auto; display: block; border: 1px solid var(--edge); background: var(--panel); }
  .gallery-cap { padding: 10px 2px 0; }
  .gallery-cap .obj { font-family: var(--serif); font-size: 17px; color: var(--ink); }
  .gallery-cap .desc { font-size: 14.5px; color: var(--body); line-height: 1.62; margin-top: 4px; }
  .gallery-cap .fov { font-size: 13px; color: var(--label); margin-top: 4px; }
  .media { margin-top: clamp(28px, 4vw, 40px); border-top: 1px solid var(--rule); padding-top: 20px; }
  .media .gallery { margin-top: 14px; }
  figure.gallery-item { margin: 0; }
  .gallery-item video { width: 100%; height: auto; display: block; border: 1px solid var(--edge); background: #000; }
  .gallery-credit { font-size: 13px; color: var(--label); margin-top: 20px; border-top: 1px solid var(--edge); padding-top: 12px; }

  /* rubin block */
  .rubin { display: grid; gap: clamp(20px, 4vw, 40px); }
  @media (min-width: 820px) { .rubin { grid-template-columns: minmax(0, 1fr) 320px; } }
  .rubin p { color: var(--body); line-height: 1.7; max-width: 62ch; }
  .roles { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 9px; font-size: 14.5px; color: var(--second); }
  .roles li { padding-left: 16px; position: relative; line-height: 1.55; }
  .roles li::before { content: ""; position: absolute; left: 0; top: 9px; width: 6px; height: 6px; background: var(--accent); }
  .roles .badge { display: inline-block; vertical-align: middle; margin-left: 4px; line-height: 0; }
  .roles .badge img { height: 20px; width: auto; }
  .topicchips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 18px; }
  .topicchips span { font-size: 13px; padding: 5px 11px; border: 1px solid var(--edge); background: var(--panel); color: var(--second); }

  /* publications */
  .pubs { display: flex; flex-direction: column; gap: 0; }
  .pub { display: grid; gap: 2px 18px; padding-block: 15px; border-top: 1px solid var(--edge); align-items: baseline; }
  .pub:first-child { border-top: 0; }
  @media (min-width: 640px) { .pub { grid-template-columns: 62px minmax(0, 1fr) 132px; } }
  .pub .yr { font-size: 14px; color: var(--label); font-variant-numeric: tabular-nums; }
  .pub .ti { font-size: 15.5px; line-height: 1.5; color: var(--ink); }
  .pub .vn { font-size: 13px; color: var(--label); }
  @media (min-width: 640px) { .pub .vn { text-align: right; } }
  .star { color: var(--accent); margin-right: 5px; }

  /* news + contact */
  .split { display: grid; gap: clamp(18px, 4vw, 40px); }
  @media (min-width: 820px) { .split { grid-template-columns: 190px minmax(0, 1fr); } }
  .news { display: flex; flex-direction: column; gap: 14px; max-width: 70ch; }
  .item { display: grid; gap: 2px 18px; }
  @media (min-width: 520px) { .item { grid-template-columns: 92px minmax(0, 1fr); align-items: baseline; } }
  .when { font-size: 14px; color: var(--label); }
  .when small { display: block; font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; margin-top: 2px; }
  .what { font-size: 15.5px; line-height: 1.62; color: var(--body); }

  footer.site { border-top: 1px solid var(--rule); }
  .foot { display: flex; flex-wrap: wrap; gap: 8px 24px; justify-content: space-between;
          padding-block: 22px 40px; font-size: 13px; color: var(--label); }

  @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

  /* story page */
  .story { padding-block: clamp(32px, 5vw, 52px); max-width: 1120px; }
  .story h1 { margin: 10px 0 28px; max-width: 22ch; }
  .story .kicker a { color: var(--label); }
  .comic { display: grid; gap: 16px; margin-bottom: clamp(32px, 5vw, 48px); }
  @media (min-width: 720px) { .comic { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  .panel { margin: 0; background: var(--panel); border: 1px solid var(--edge); padding: 14px 14px 12px; }
  .panel figcaption { font-size: 14.5px; line-height: 1.55; color: var(--body); margin-top: 8px; }
  .panel figcaption b { font-weight: 600; color: var(--accent); margin-right: 6px; }
  .paper { fill: var(--panel); }
  .win { fill: var(--accent); opacity: 0.22; }
  text.say { font-family: var(--sans); font-size: 15px; font-weight: 600; letter-spacing: 1px; fill: var(--ink); }
  text.say.acc { fill: var(--accent); }
  text.say.big { font-size: 30px; }
  .prose { max-width: 66ch; display: flex; flex-direction: column; gap: 16px; }
  .prose p { color: var(--body); font-size: 16.5px; line-height: 1.75; }
  .prose blockquote { margin: 4px 0; padding: 14px 20px; border-left: 3px solid var(--accent); background: var(--panel);
                      display: flex; flex-direction: column; gap: 8px; }
  .prose blockquote p { font-family: var(--serif); font-size: 17px; line-height: 1.55; color: var(--ink); }
  .timeline { margin-top: clamp(36px, 5vw, 52px); border-top: 1px solid var(--rule); padding-top: 24px; max-width: 760px; }
  .timeline .day { font-family: var(--serif); font-size: 18px; color: var(--ink); margin: 18px 0 10px; }
  .timeline .item { grid-template-columns: 120px minmax(0, 1fr); }
  .timeline .what { font-size: 15px; }
  .back { margin-top: 36px; font-size: 15px; }
  /* places page */
  .album { display: grid; gap: 22px; }
  @media (min-width: 760px) { .album { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  .album figure { margin: 0; }
  .album figure.wide { grid-column: 1 / -1; }
  .album img { width: 100%; height: auto; display: block; border: 1px solid var(--edge); background: var(--panel); }
  .album figcaption { padding: 10px 2px 0; }
  .album .obj { font-family: var(--serif); font-size: 18px; color: var(--ink); }
  .album .desc { font-size: 14.5px; line-height: 1.6; color: var(--body); margin-top: 4px; }
  .album .fov { font-size: 13px; color: var(--label); margin-top: 4px; }
</style>
</head>

    <div class="album">
      <figure class="wide">
        <img src="assets/place-stromlo-2017.jpg" width="1600" height="1200" loading="lazy"
